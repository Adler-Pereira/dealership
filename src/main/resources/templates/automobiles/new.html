<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adicionar novo automóvel</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold">🚗 Dealership</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 fw-bold">Registrar Novo Automóvel</h3>
                <form th:action="@{/automobiles/new}" th:object="${automobile}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Número do Chassi</label>
                            <input type="text" class="form-control"
                                   th:field="*{chassiNumber}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Montadora</label>
                            <input type="text" class="form-control"
                                   th:field="*{manufacturer}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Modelo</label>
                            <input type="text" class="form-control"
                                   th:field="*{model}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Ano</label>
                            <input type="number" class="form-control"
                                   th:field="*{year}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Quilômetros</label>
                            <input type="number" class="form-control"
                                   th:field="*{kilometer}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cor</label>
                        <input type="text" class="form-control"
                               th:field="*{color}" required>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/automobiles/list}" class="btn btn-secondary">
                            Cancelar
                        </a>
                        <input type="submit" class="btn btn-success" value="Salvar Automóvel">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
