<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Automóveis</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold">🚗 Dealership</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Lista de Automóveis</h2>
            <a th:href="new" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Novo Automóvel
            </a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Chassi</th>
                            <th>Montadora</th>
                            <th>Modelo</th>
                            <th>Ano</th>
                            <th>Cor</th>
                            <th>Quilômetragem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="auto : ${listAuto}">
                            <td th:text="*{auto.id}"></td>
                            <td th:text="*{auto.chassiNumber}"></td>
                            <td th:text="*{auto.manufacturer}"></td>
                            <td th:text="*{auto.model}"></td>
                            <td th:text="*{auto.year}"></td>
                            <td th:text="*{auto.color}"></td>
                            <td th:text="*{auto.kilometer}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listAuto)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                Nenhum veículo registrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
